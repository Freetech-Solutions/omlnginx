networks:
  omlswarm:
    external: true

volumes:
  gearman_data:

services:
  gearman:
    image: artefactual/gearmand:latest
    volumes:
      - gearman_data:/var/lib/gearman
    networks:
      - omlswarm
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
