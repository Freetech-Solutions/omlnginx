networks:
  omlswarm:
    external: true

services:

  # Admin htmlx render
  render-template:
    image: ${WORKER_IMG}
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    environment:
      - GEARMAN_JOBS=render-template
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - ASTERISK_HOST=${ASTERISK_DIALER_HOSTNAME}
      - ASTERISK_PORT=${ASTERISK_DIALER_ARI_PORT}
      - ASTERISK_USER=${AMI_USER}
      - ASTERISK_PASS=${AMI_PASSWORD}
      - ASTERISK_APP=${ASTERISK_APP}
      - CAPS=${CAPS}
      - DIALER_ACD_HOST=${DIALER_ACD_HOST}            
      - POSTGRES_OML_SERVER=${PGHOST}
      - POSTGRES_OML_PORT=${PGPORT}
      - POSTGRES_OML_USER=${PGUSER}
      - POSTGRES_OML_PASSWORD=${PGPASSWORD}  
      - POSTGRES_DIALER_SERVER=${POSTGRES_DIALER_SERVER}
      - POSTGRES_DIALER_PORT=${POSTGRES_DIALER_PORT}
      - POSTGRES_DIALER_USER=${POSTGRES_DIALER_USER}  
      - POSTGRES_DIALER_PASSWORD=${POSTGRES_DIALER_PASS}  
      - POSTGRES_DIALER_DB=${POSTGRES_DIALER_DB}
      - REDIS_OML_SERVER=${REDIS_OML_SERVER}
      - REDIS_OML_PORT=${REDIS_OML_PORT}
      - REDIS_DIALER_SERVER=${REDIS_DIALER_SERVER}
      - REDIS_DIALER_PORT=${REDIS_DIALER_PORT}
    networks:
      - omlswarm
  # Worker Dialer Scheduler 
  scheduler_worker:
    image: ${SCHEDULER_IMG}  
    ports:
      - '1441:1441'
    networks:
      - omlswarm
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - REDIS_DIALER_SERVER=${REDIS_DIALER_SERVER}
      - REDIS_DIALER_PORT=${REDIS_DIALER_PORT}
      - TZ=${TZ}
  # Worker Dialer Websocket Event LISTENER
  listener_worker:
    image: ${LISTENER_IMG}  
    networks:
      - omlswarm
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_DIALER_HOSTNAME}
      - ASTERISK_PORT=$ASTERISK_DIALER_ARI_PORT}
      - ASTERISK_USER=${AMI_USER}
      - ASTERISK_PASS=${AMI_PASSWORD}
      - ASTERISK_APP=${ASTERISK_APP}
      - ASTERISK_APP_DIALER=${ASTERISK_APP_DIALER}
      - TZ=${TZ}
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
