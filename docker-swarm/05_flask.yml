networks:
  omlswarm:
    external: true

services:
  api:
    image: ${API_IMG}
    networks:
      - omlswarm
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - GEARMAN_CONNECTION_ATTEMPTS=3
      - GEARMAN_CONNECTION_TIMEOUT=10
      - WEBSOCKET_SERVER=${WEBSOCKET_SERVER}
      - PYTHONUNBUFFERED=1
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    ports:
      - published: 1440
        target: 1440
        protocol: tcp
        mode: ingress