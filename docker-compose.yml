services:
  api:
    build:
      target: builder
      context: ./interface/src
    container_name: omnidialer-api
    volumes:
      - ./interface/src:/app
    ports:
      - '1440:1440'
    networks:
      - network1
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    depends_on:
      - job_server
      - redis

  job_server:
    image: artefactual/gearmand:1.1.19.1-alpine
    container_name: gearman_job_server_1
    ports:
      - '4730:4730'
    networks:
      - network1

  worker:
    container_name: handle_campaign_worker
    build:
      target: builder
      context: ./workers/handle-campaign/src
    volumes:
      - ./workers/handle-campaign/src:/app
    networks:
      - network1
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_HOST}
      - ASTERISK_PORT=${ASTERISK_PORT}
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASS=${ASTERISK_PASS}
      - ASTERISK_APP=${ASTERISK_APP}
      - REDIS_OML_SERVER=${REDIS_OML_SERVER}
      - REDIS_OML_PORT=${REDIS_OML_PORT}
      - TZ=${TZ}
    depends_on:
      - job_server
      - redis

  redis:
    container_name: omnidialer-redis
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - BIND_IP=0.0.0.0
    networks:
      - network1
    ports:
      - '6380:6380'
    expose:
      - '6380'
    image: redis:7.2.5-alpine
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - redis_omnidialer:/data
    command: redis-server --port 6380

  redisinsight:
    container_name: omnidialer-redisinsight
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - BIND_IP=0.0.0.0
    networks:
      - network1
    ports:
      - '5540:5540'
    expose:
      - '5540'
    image: redis/redisinsight:latest
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - redis_redisinsight:/data

networks:
  network1:
    name: devenv_omnileads
    external: true

volumes:
  redis_omnidialer:
  redis_redisinsight:
