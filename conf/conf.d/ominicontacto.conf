server {
  listen          80;
  server_name     nginx;
  rewrite ^ https://$http_host$request_uri? permanent;
}

server {
  listen          443 ssl;
  server_name     nginx;
  access_log      /var/log/nginx/access.log combined;
  error_log       /var/log/nginx/error.log error;

  ssl_certificate        /etc/nginx/certs/cert.pem;
  ssl_certificate_key    /etc/nginx/certs/key.pem;


  location ~* (ws) {
    alias /opt/omnileads/static/ominicontacto/JS/socket.io.js;
    proxy_pass https://kamailio:14443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
  }

  location /grabaciones {
    alias /var/spool/asterisk/monitor;
    autoindex on;
    allow all;
  }

  location / {
    uwsgi_pass         app:8099;
    include         uwsgi_params;
    uwsgi_send_timeout 600s;
    uwsgi_read_timeout 600s;
    uwsgi_connect_timeout 600s;
    keepalive_timeout 600s;
		send_timeout      600s;
    uwsgi_param HTTP_X_REAL_IP $remote_addr;
    uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    uwsgi_param HTTP_X_FORWARDED_PORT $server_port;
    uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
    uwsgi_param HTTP_REFERER $http_referer;
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
  }
}
