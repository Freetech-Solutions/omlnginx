include:
  - project: 'omnileads/devsecops'
    ref: 'develop'
    file:
      - 'templates/security-scans.yml'
      - 'templates/gitleaks.yml'
      - 'templates/sonarqube.yml'
      - 'templates/docker-build-push.yml'

variables:
  IMAGE_NAME: "nginx"
  # Valores válidos: omnileads | freetechsolutions. Vacío = según rama (master-2.0 / master-3.0 → omnileads).
  DOCKER_ORG: ""
  FULL: ""
  BUILD: ""
  # ARM64=true → build/push multi-arch (amd64+arm64) vía devsecops docker-build-push.
  ARM64: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  TRIVY_SEVERITY: "CRITICAL"
  # DefectDojo: nombre del Product (Asset) en DefectDojo.
  # Para la estrategia "1 Repo = 1 Producto", mantén vacía la variable DEFECTDOJO_ENGAGEMENT_ID en GitLab
  # y este script creará/resolverá el producto y el engagement "Continuous Security" automáticamente.
  DEFECTDOJO_PRODUCT_NAME: "OMniNginx"
  # DefectDojo con certificado interno/auto-firmado (override en CI/CD si usan CA pública).
  DEFECTDOJO_INSECURE: "true"
  # Sin variables → gitleaks, sonarqube, build, security_scan y security_report.
  # BUILD=true → solo build (container-image-dev).
  # FULL=true → pipeline completo: gitleaks, sonarqube, build y escaneos de seguridad.

stages:
  - security
  - sonarqube
  - build
  - security_scan
  - security_report

.build-rules: &build-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'

.sonar-rules: &sonar-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'

# Las reglas de Trivy se heredan por defecto de la plantilla central

.gitleaks-rules: &gitleaks-rules
  rules:
    - if: '$BUILD == "true" && $FULL != "true"'
      when: never
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL == "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-3.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0")'
    - if: '$FULL != "true" && $BUILD != "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$FULL != "true" && $BUILD != "true" && ($CI_COMMIT_BRANCH == "develop-3.0" || $CI_COMMIT_BRANCH == "master-3.0" || $CI_COMMIT_BRANCH == "develop-2.0" || $CI_COMMIT_BRANCH == "master-2.0")'

# Job SonarQube centralizado en omnileads/devsecops (templates/sonarqube.yml).
sonarqube_scan:
  stage: sonarqube
  <<: *sonar-rules

sonarqube_defectdojo_upload:
  <<: *sonar-rules

container-image-dev:
  extends: .docker_container_image
  stage: build
  variables:
    IMAGE_NAME: nginx
    DOCKERFILE_PATH: Dockerfile
    BUILD_CONTEXT: .
  artifacts:
    paths:
      - nginx.tar
    expire_in: 90 days

  <<: *build-rules
# Los jobs trivy_scan, defectdojo_upload, gitleaks_defectdojo_upload y sonarqube_defectdojo_upload se heredan de devsecops.

# GitLab no expande ${GITLEAKS_STAGE} del template incluido en el campo stage.
gitleaks_scan:
  stage: security
  <<: *gitleaks-rules
