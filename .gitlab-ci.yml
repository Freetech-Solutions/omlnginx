stages:
  - build

build-docker:
  stage: build
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    INFRA: docker
  image: gitlab/dind
  script:
    - cd build/docker && bash build_images.sh
  only:
    - web
    - merge_requests
    - /.*release.*$/
    - /.*master.*$/
