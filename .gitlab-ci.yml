stages:
  - build

build-image:
  stage: build
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    INFRA: docker
  image: gitlab/dind
  script:
    - bash build_images.sh
  only:
    - web
    - /.*release.*$/

build-rpm:
  stage: build
  variables:
    INFRA: onpremise
    ENV: prodenv
  image: freetechsolutions/fpm-ansible:centos7
  script:
    - bash build_rpm.sh
  only:
    - web
    - /.*release.*$/
