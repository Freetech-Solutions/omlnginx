stages:
  - build

build:
  stage: build
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    # See https://github.com/docker-library/docker/pull/166
    DOCKER_TLS_CERTDIR: ""
  image: gitlab/dind
  script:
    - docker login -u $FTS_DOCKER_USER -p $FTS_DOCKER_PASSWORD
    - docker build -t freetechsolutions/omlnginx:1.19-$CI_COMMIT_SHORT_SHA .
    - docker build -t freetechsolutions/omlnginx:latest .
    - docker push freetechsolutions/omlnginx:1.19-$CI_COMMIT_SHORT_SHA
    - docker push freetechsolutions/omlnginx:latest
  only:
    - web
