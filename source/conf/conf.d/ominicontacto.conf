server {
  listen          80;
  server_name     nginx;
  rewrite ^ https://$http_host$request_uri? permanent;
}

server {
  listen          443 ssl;
  server_name     nginx;
  access_log      /var/log/nginx/example_access.log combined;
  error_log       /var/log/nginx/example_error.log error;

  ssl_certificate        /opt/omnileads/nginx_certs/cert.pem;
  ssl_certificate_key    /opt/omnileads/nginx_certs/key.pem;


  location ~* (ws) {
    alias /opt/omnileads/static/ominicontacto/JS/socket.io.js;
    proxy_pass https://kamailio:14443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
  }

  location /grabaciones {
    internal;
    alias /var/spool/asterisk/monitor;
  }
  include /etc/nginx/conf.d/environment/*.conf;

  location /consumers {
    alias /opt/omnileads/static/ominicontacto/JS/socket.io.js;
    proxy_pass http://websockets:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
  }
}
