services:
  api:
    build:
      target: builder
      context: src
    container_name: omnidialer-api
    volumes:
      - ./src:/app
    ports:
      - '1440:1440'
    networks:
      - network1
    stop_signal: SIGINT

  job_server:
    image: artefactual/gearmand:1.1.19.1-alpine
    container_name: gearman_job_server_1
    ports:
      - '4730:4730'
    networks:
      - network1

  worker:
    container_name: handle_campaign_worker
    build:
      target: builder
      context: src
    volumes:
      - ../workers/handle-campaign/src:/app
    networks:
      - network1

networks:
  network1:
    name: devenv_omnileads
    external: true
